name: Digest zilnic imobiliar

on:
  schedule:
    # 05:00 UTC = 08:00 ora României (EET/EEST)
    - cron: "0 5 * * *"
  workflow_dispatch:
    # Trigger manual din interfața GitHub pentru teste

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesar pentru commit + push sent_articles.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalare dependențe
        run: pip install -r requirements.txt

      - name: Rulare digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit și push sent_articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json
          # Commit doar dacă fișierul s-a schimbat
          git diff --staged --quiet || git commit -m "chore: actualizare sent_articles.json [skip ci]"
          git push
